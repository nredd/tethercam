# cargo-deny: supply-chain gate. Every exception needs a written reason.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Only licenses actually present in the tree. Add one when a dependency needs it.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # rusty_h264-encoder, rusty_h264-common, rusty_h264-accel: the chosen pure-Rust H.264 encoder (best
    # speed and quality of those evaluated), see docs/encoder-evaluation.md. Permissive, no copyleft.
    "BSD-2-Clause",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Native boundary exception (feature `macos-icc`, off by default, macOS-only). Its licenses are already
# allowed above and it vendors no C. The only exception it needs is this pin: any other version is
# banned until a renewed independent source review is recorded in docs/macos-camera.md.
deny = [
    { crate = "image-capture:>0.1.0", reason = "unsafe native boundary; bumps need renewed review" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
