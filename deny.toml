# cargo-deny: supply-chain gate. Every exception needs a written reason.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Only licenses actually present in the tree. Add one when a dependency needs it.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # rusty_h264-encoder, rusty_h264-common, rusty_h264-accel: the chosen pure-Rust H.264 encoder (best
    # speed and quality of those evaluated), see docs/encoder-evaluation.md. Permissive, no copyleft.
    "BSD-2-Clause",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
