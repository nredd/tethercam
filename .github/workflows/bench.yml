name: Bench
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt, llvm-tools-preview
          targets: aarch64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Pull requests compile every benchmark and run each once. Timings on shared runners
      # are too noisy to gate on, so full runs happen on main and are kept as artifacts.
      - if: github.event_name == 'pull_request'
        run: make bench-check
      - if: github.event_name == 'push'
        run: make bench
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-${{ github.sha }}
          path: target/criterion
          retention-days: 90
