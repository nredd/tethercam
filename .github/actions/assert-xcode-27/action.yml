name: Assert the Xcode 27 runner image
description: >
  Print the runner OS and Xcode versions, then fail unless this is arm64 macOS 27 with Xcode 27.
  The `xcode-27` label resolves to the macOS 27 image, but a retargeted label must fail loudly
  rather than quietly run the gate on another OS.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -eu
        sw_vers
        xcodebuild -version
        arch=$(uname -m)
        os_major=$(sw_vers -productVersion | cut -d. -f1)
        xcode_major=$(xcodebuild -version | sed -n '1s/^Xcode \([0-9]*\).*/\1/p')
        echo "arch=$arch os_major=$os_major xcode_major=$xcode_major"
        test "$arch" = arm64 || { echo "::error::expected arm64, got '$arch'"; exit 1; }
        test "$os_major" = 27 || { echo "::error::expected macOS 27, got '$os_major'"; exit 1; }
        test "$xcode_major" = 27 || { echo "::error::expected Xcode 27, got '$xcode_major'"; exit 1; }
