[package]
name = "tethercam"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
description = "Turn a USB-tethered Sony Alpha camera into an ONVIF/RTSP network camera for UniFi Protect and Home Assistant"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nredd/tethercam"
readme = "README.md"
keywords = ["camera", "ptp", "onvif", "rtsp", "sony"]
categories = ["multimedia::video", "hardware-support", "network-programming"]
exclude = [".github/", "scripts/", "docs/"]

[lib]
name = "tethercam"
path = "src/lib.rs"

[[bin]]
name = "tethercam"
path = "src/main.rs"

[dependencies]
constant_time_eq = { version = "0.6.1", default-features = false }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_path_to_error = "0.1.20"
tempfile = "3.27.0"
thiserror = "2"
toml = "1.2.1"
uuid = { version = "1.29.2", features = ["serde", "std"], default-features = false }
zeroize = "1.9.1"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3.27.0"

[[bench]]
name = "ptp_container"
harness = false

[[bench]]
name = "ptp_dataset"
harness = false

[[bench]]
name = "ptp_session"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
debug = "line-tables-only"

[[bench]]
name = "rtp_packetize"
harness = false
