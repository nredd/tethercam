[package]
name = "tethercam"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
description = "Turn a USB-tethered Sony Alpha camera into an ONVIF/RTSP network camera for UniFi Protect and Home Assistant"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nredd/tethercam"
readme = "README.md"
keywords = ["camera", "ptp", "onvif", "rtsp", "sony"]
categories = ["multimedia::video", "hardware-support", "network-programming"]
exclude = [".github/", "scripts/", "docs/"]

[lib]
name = "tethercam"
path = "src/lib.rs"

[[bin]]
name = "tethercam"
path = "src/main.rs"

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["std"] }
constant_time_eq = { version = "0.6.1", default-features = false }
getrandom = "0.4.3"
md-5 = { version = "0.10", default-features = false }
roxmltree = { version = "0.21", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_path_to_error = "0.1.20"
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
toml = "1.2.1"
uuid = { version = "1.29.2", features = ["serde", "std"], default-features = false }
zeroize = "1.9.1"
# Pure-Rust JPEG decoder. The `x86` / `neon` intrinsics features are off: the safe path measured
# as fast or faster (docs/encoder-evaluation.md).
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
# Pure-Rust H.264 encoder. `asm` is the portable-Rust SIMD kernels (2x faster, `unsafe` quarantined in
# `rusty_h264-accel`); `global-alloc` is off because it installs a process-wide `#[global_allocator]`.
rusty_h264-encoder = { version = "0.17", default-features = false, features = ["std", "asm"] }
rusty_h264-common = { version = "0.17", default-features = false, features = ["std"] }
log = { version = "0.4.35", default-features = false }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3.27.0"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
# Synthetic JPEG fixtures for tests and benches (any subsampling, any size).
jpeg-encoder = { version = "0.7", default-features = false }

[[bench]]
name = "ptp_container"
harness = false

[[bench]]
name = "ptp_dataset"
harness = false

[[bench]]
name = "ptp_session"
harness = false

[[bench]]
name = "onvif_auth"
harness = false

[[bench]]
name = "sony_live_view"
harness = false

[[bench]]
name = "rtsp"
harness = false

[[bench]]
name = "media"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
debug = "line-tables-only"

[[bench]]
name = "rtp_packetize"
harness = false
